<!doctype html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Antigravity CLI dans Ledge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;650&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Approuvée par l'owner le 2026-11-27 : logo Gemini (« google ») et mascotte « L'étincelle » ; les variantes Antigravity et « L'arche » sont écartées.
   Précisé le même jour : les tuiles d'agents de « Nouvelle session » par rangées de trois (cinq sur une ligne font passer chaque nom à la ligne
   dans la fenêtre réelle) ; sur le téléphone, la tuile d'agy dit « Modèles Gemini » / « Gemini models », comme les autres disent leur rôle.
   Antigravity CLI (agy) comme cinquième agent : son identité (logo du fournisseur, mascotte) et les écrans où il apparaît.
   Base : docs/mockups/ledge-launch-name.html (même grille, mêmes tokens), packages/ui (ProviderLogo, Bot, logo.css),
   apps/desktop/src/launch/LaunchModal.tsx, settings/General.tsx, apps/mobile/src/screens/NewSession.tsx, ledge tui.
   Les marques et silhouettes sont lues dans les sources (packages/ui) ; spec : docs/superpowers/specs/2026-11-25-antigravity-cli.md. */
:root[data-theme="dark"]{
  color-scheme:dark;
  --background:oklch(0.145 0 0);--foreground:oklch(0.985 0 0);--card:oklch(0.205 0 0);--muted:oklch(0.269 0 0);--muted-foreground:oklch(0.708 0 0);
  --primary:oklch(0.444 0.177 26.899);--border:#ffffff1a;--input:#ffffff26;--accent:#ffffff10;--page:#000;--shell:#0d0d0d;--side:#141414;--ok:#34d399;--warn:#fbbf24;
  --agy-top:#4f8ff7;--agy-bottom:#2a5fc8;--agy-visor:#14234a;
}
:root[data-theme="light"]{
  color-scheme:light;
  --background:oklch(1 0 0);--foreground:oklch(0.145 0 0);--card:oklch(1 0 0);--muted:oklch(0.97 0 0);--muted-foreground:oklch(0.556 0 0);
  --primary:oklch(0.505 0.213 27.518);--border:oklch(0.922 0 0);--input:oklch(0.922 0 0);--accent:#0000000a;--page:oklch(0.95 0 0);--shell:oklch(0.985 0 0);--side:oklch(0.975 0 0);--ok:#059669;--warn:#a25a00;
  --agy-top:#d6e6ff;--agy-bottom:#93b7f0;--agy-visor:#1c2b4d;
}
*{box-sizing:border-box}
body{margin:0;font-family:'Geist','Segoe UI',system-ui,sans-serif;background:var(--page);color:var(--foreground);font-size:13px;line-height:18px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
code,.mono{font-family:'Geist Mono',ui-monospace,Consolas,monospace;font-size:11.5px}
.mut{color:var(--muted-foreground)}
header.bar{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:12px 20px;background:var(--shell);border-bottom:1px solid var(--border)}
header.bar h1{font-size:14px;font-weight:600;margin:0}
header.bar .sub{color:var(--muted-foreground);font-size:12px;flex:1}
.seg{display:inline-flex;border:1px solid var(--input);border-radius:7px;overflow:hidden}
.seg button{padding:3px 10px;font-size:12px;color:var(--muted-foreground)}
.seg button.on{background:var(--muted);color:var(--foreground)}
main{padding:20px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;max-width:1400px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden}
.card.wide{grid-column:1/-1}
.card>h2{font-size:12.5px;font-weight:600;margin:0;padding:10px 14px 0;display:flex;gap:8px;align-items:baseline}
.card>h2 .n{color:var(--muted-foreground);font-weight:500}
.card>.what{margin:4px 14px 0;color:var(--muted-foreground);font-size:12px}
.card>.body{padding:14px}
.logo{display:inline-flex;align-items:center;justify-content:center;flex:none}
.logo svg{display:block}
/* Identité */
.idgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.opt{border:1px solid var(--border);border-radius:9px;padding:12px;display:flex;flex-direction:column;gap:10px}
.opt.on{border-color:var(--foreground)}
.opt h3{margin:0;font-size:12.5px;font-weight:600;display:flex;gap:8px;align-items:center}
.opt h3 .tag{font-size:10.5px;font-weight:500;padding:1px 6px;border-radius:5px;background:var(--muted);color:var(--muted-foreground)}
.opt .row{display:flex;align-items:center;gap:14px}
.opt .sizes{display:flex;align-items:flex-end;gap:12px}
.opt .sizes span{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10.5px;color:var(--muted-foreground)}
.opt p{margin:0;font-size:12px;color:var(--muted-foreground)}
.bots{display:flex;gap:18px;align-items:flex-end}
.bots figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10.5px;color:var(--muted-foreground)}
/* Nouvelle session (Desktop) */
.modal{background:var(--background);border:1px solid var(--border);border-radius:12px;padding:14px;display:grid;grid-template-columns:110px 1fr;gap:12px 14px;align-items:start}
.lbl{color:var(--muted-foreground);font-size:12px;padding-top:9px}
.agents{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.agent{display:flex;flex-direction:column;gap:5px;padding:9px 10px;border:1px solid var(--border);border-radius:9px;min-width:0}
.agent.on{border-color:var(--foreground);background:color-mix(in srgb,var(--foreground) 3%,transparent)}
.agent .an{display:flex;align-items:center;gap:8px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.agent small{font-size:11px;color:var(--muted-foreground)}
.agent small b{color:var(--foreground);font-weight:600}
.field{border:1px solid var(--input);border-radius:8px;padding:8px 10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.field .k{color:var(--muted-foreground)}
.hintline{grid-column:2;color:var(--muted-foreground);font-size:11.5px;margin-top:-6px}
/* Réglages */
.setrow{display:grid;grid-template-columns:220px 1fr;gap:14px;align-items:start}
.setrow .h{font-weight:600}.setrow .h small{display:block;font-weight:400;color:var(--muted-foreground);font-size:11.5px;margin-top:3px}
.segbig{display:flex;flex-wrap:wrap;border:1px solid var(--input);border-radius:8px;padding:2px;gap:2px;width:max-content;max-width:100%}
.segbig button{display:flex;align-items:center;gap:7px;padding:5px 10px;border-radius:6px;color:var(--muted-foreground);font-size:12.5px}
.segbig button.on{background:var(--muted);color:var(--foreground)}
/* Explorateur */
.tree{background:var(--side);border:1px solid var(--border);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:2px;width:300px}
.tree .proj{font-size:11px;color:var(--muted-foreground);padding:6px 8px 4px;text-transform:uppercase;letter-spacing:.04em}
.sess{display:flex;align-items:center;gap:9px;padding:6px 8px;border-radius:7px}
.sess.on{background:var(--accent)}
.sess .nm{font-weight:600}.sess .tp{color:var(--muted-foreground);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.sess .st{font-size:10.5px;padding:1px 6px;border-radius:5px;background:var(--muted);color:var(--muted-foreground)}
.sess .st.ask{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.tab{display:inline-flex;align-items:center;gap:8px;padding:6px 10px;border:1px solid var(--border);border-bottom:0;border-radius:8px 8px 0 0;background:var(--background)}
.explore{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap}
/* Téléphone */
.phone{width:300px;border:1px solid var(--border);border-radius:22px;padding:14px;background:var(--background);display:flex;flex-direction:column;gap:10px}
.phone h4{margin:0;font-size:15px}
.pgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.pgrid div{display:flex;align-items:center;gap:7px;border:1px solid var(--border);border-radius:9px;padding:8px 9px;font-weight:500}
.pgrid div.on{border-color:var(--foreground)}
/* TUI */
.tui{font-family:'Geist Mono',ui-monospace,monospace;font-size:12px;line-height:18px;background:#0b0b0c;color:#d7d7d7;border-radius:8px;padding:12px 14px;white-space:pre}
:root[data-theme="light"] .tui{background:#fbfbfa;color:#222;border:1px solid var(--border)}
.tui .sel{color:#7fb2ff}.tui .dim{opacity:.55}
.notes{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px;color:var(--muted-foreground);font-size:12px}
.notes b{color:var(--foreground);font-weight:600}
@media (max-width:900px){main{grid-template-columns:1fr}.agents{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>

      '<b>Requests</b>: agy\'s permissions, questions and refusals with a note show in the existing cards, with no new drawing.',
      '<b>“Always allow”</b> holds for the conversation only (never the option that writes agy\'s settings); a file edit has none.',
      '<b>Texts</b>: “Antigravity CLI” everywhere, in French and English; the provider is named “Google”.'
    ]
  }
};

let uid = 0;
/** A provider's mark, as ProviderLogo draws it. */
function logo(p, size = 16) {
  const M = DATA.marks;
  if (p === 'google') {
    const id = `g${uid++}`;
    const w = [['#08B962', 7, 15.5, 11, 12, 1], ['#F94543', 8, 5.5, 11.5, 11, 1], ['#FABC12', 3.5, 13.5, 17.5, 12, .46]];
    return `<span class="logo"><svg width="${size}" height="${size}" viewBox="0 0 24 24"><defs>${w.map((g, i) => `<linearGradient id="${id}-${i}" gradientUnits="userSpaceOnUse" x1="${g[1]}" y1="${g[2]}" x2="${g[3]}" y2="${g[4]}"><stop stop-color="${g[0]}"/><stop offset="${g[5]}" stop-color="${g[0]}" stop-opacity="0"/></linearGradient>`).join('')}</defs><path fill="#3186FF" d="${M.google}"/>${w.map((_, i) => `<path fill="url(#${id}-${i})" d="${M.google}"/>`).join('')}</svg></span>`;
  }
  if (p === 'omp') return `<span class="logo"><svg width="${size}" height="${size}" viewBox="0 0 64 64"><defs><linearGradient id="o${uid}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="oklch(0.7 0.24 340)"/><stop offset=".5" stop-color="oklch(0.62 0.21 295)"/><stop offset="1" stop-color="oklch(0.81 0.14 200)"/></linearGradient></defs><path fill="url(#o${uid++})" d="M10 14h44v9H43v33h-9V23h-9v22h-9V23H10z"/></svg></span>`;
  const fill = p === 'anthropic' ? '#D97757' : 'currentColor';
  return `<span class="logo"><svg width="${size}" height="${size}" viewBox="0 0 24 24"><path fill="${fill}" fill-rule="${p === 'anthropic' ? 'nonzero' : 'evenodd'}" d="${M[p]}"/></svg></span>`;
}
const agyMark = s => logo(MARK, s);
/** The spark mascot (or the arch), as LogoBot draws it: the shell in its gradient, the eyes on it. */
function bot(kind, size, eyes = 'open', head = false) {
  const id = `b${uid++}`;
  const shell = kind === 'arch' ? `<path transform="translate(6 6) scale(3.5)" d="${DATA.marks.antigravity}" fill="url(#${id})"/>` : `<path d="${DATA.shells.agy}" fill="url(#${id})"/>`;
  const y = kind === 'arch' ? 33 : 43;
  const e = eyes === 'happy' ? `<path d="M36 ${y + 8}q3-5 6 0M55 ${y + 8}q3-5 6 0" fill="none" stroke="var(--agy-visor)" stroke-width="3" stroke-linecap="round"/>`
    : `<rect x="36" y="${y}" width="6" height="${eyes === 'wide' ? 14 : 12}" rx="3" fill="var(--agy-visor)"/><rect x="55" y="${y}" width="6" height="${eyes === 'wide' ? 14 : 12}" rx="3" fill="var(--agy-visor)"/>`;
  const box = head ? (kind === 'arch' ? '6 6 84 64' : '8 8 80 80') : '0 0 96 96';
  return `<svg width="${size}" height="${size}" viewBox="${box}"><defs><linearGradient id="${id}" x1=".1" y1="0" x2=".8" y2="1"><stop stop-color="var(--agy-top)"/><stop offset="1" stop-color="var(--agy-bottom)"/></linearGradient></defs>${head ? '' : '<ellipse cx="48" cy="92" rx="22" ry="2.5" fill="currentColor" opacity=".12"/>'}${shell}${e}</svg>`;
}
const TOOLS = [['claude', 'Claude Code', 'anthropic', 'Anthropic'], ['codex', 'Codex', 'openai', 'OpenAI'], ['cursor', 'Cursor Agent', 'cursor', 'Cursor'], ['agy', 'Antigravity CLI', 'google', 'Google'], ['omp', 'OMP', 'omp', 'Oh My Pi']];
const markOf = t => (t[0] === 'agy' ? agyMark(16) : logo(t[2], 16));

function render() {
  const x = T[L];
  document.documentElement.lang = L;
  document.getElementById('title').textContent = x.title;
  document.getElementById('sub').textContent = x.sub;
  const mb = document.querySelectorAll('#mark button'); mb[0].textContent = x.markA; mb[1].textContent = x.markB;
  for (const [g, v] of [['mark', MARK], ['theme', document.documentElement.dataset.theme], ['lang', L]]) for (const b of document.querySelectorAll(`#${g} button`)) b.classList.toggle('on', b.dataset.v === v);
  const card = (id, n, h, w, body, wide) => `<section class="card${wide ? ' wide' : ''}" id="${id}"><h2><span class="n">${n}</span>${h}</h2><p class="what">${w}</p><div class="body">${body}</div></section>`;
  const sizes = p => [14, 16, 24].map(s => `<span>${logo(p, s)}${s} px</span>`).join('');
  const s1 = `<div class="idgrid">
    <div class="opt ${MARK === 'google' ? 'on' : ''}"><h3>${x.logoA}<span class="tag">${x.proposed}</span></h3><div class="sizes">${sizes('google')}</div><p>${x.logoAp}</p></div>
    <div class="opt ${MARK === 'antigravity' ? 'on' : ''}"><h3>${x.logoB}<span class="tag">${x.variant}</span></h3><div class="sizes">${sizes('antigravity')}</div><p>${x.logoBp}</p></div>
    <div class="opt on"><h3>${x.botA}<span class="tag">${x.proposed}</span></h3><div class="bots"><figure>${bot('spark', 72)}${x.working}</figure><figure>${bot('spark', 72, 'wide')}${x.ask}</figure><figure>${bot('spark', 72, 'happy')}${x.idle}</figure><figure>${bot('spark', 16, 'open', true)}${x.head}</figure></div><p>${x.botAp}</p></div>
    <div class="opt"><h3>${x.botB}<span class="tag">${x.variant}</span></h3><div class="bots"><figure>${bot('arch', 72)}${x.working}</figure><figure>${bot('arch', 72, 'wide')}${x.ask}</figure><figure>${bot('arch', 72, 'happy')}${x.idle}</figure><figure>${bot('arch', 16, 'open', true)}${x.head}</figure></div><p>${x.botBp}</p></div>
  </div>`;
  const s2 = `<div class="modal"><span class="lbl">${x.agent}</span><div class="agents">${TOOLS.map((t, i) => `<div class="agent ${t[0] === 'agy' ? 'on' : ''}"><span class="an">${markOf(t)}${t[1]}</span><small>${t[3]}</small><small>${t[0] === 'agy' ? x.nolimit : `${x.limit} <b>${[34, 12, 8, 0, 0][i]} %</b>`}</small></div>`).join('')}</div>
    <span class="lbl">${x.model}</span><div class="field"><span>${x.agyModel}</span><span class="k">▾</span></div>
    <span class="lbl">${x.effort}</span><div class="field"><span>medium</span><span class="k">▾</span></div>
    <span class="lbl">${x.folders}</span><div class="field"><span class="mono">~/work/shop · ~/work/shared</span><span class="k">+</span></div>
    <span class="hintline">${x.agyHint}</span></div>`;
  const s3 = `<div class="setrow"><div class="h">${x.defTool}<small>${x.defToolH}</small></div><div class="segbig">${TOOLS.map(t => `<button class="${t[0] === 'agy' ? 'on' : ''}">${markOf(t)}${t[1]}</button>`).join('')}</div></div>`;
  const s4 = `<div class="explore"><div class="tree"><div class="proj">shop</div>
    <div class="sess on">${bot('spark', 18, 'wide', true)}<span class="nm">Nova</span><span class="tp">${x.topicA}</span><span class="st ask">${x.asking}</span></div>
    <div class="sess">${bot('spark', 18, 'open', true)}<span class="nm">Pim</span><span class="tp">${x.topicB}</span><span class="st">${x.working2}</span></div>
    </div><div><div class="tab">${agyMark(14)}<b>Nova</b><span class="mut">· shop · Antigravity CLI</span></div></div></div>`;
  const s5 = `<div class="phone"><h4>${x.newSession}</h4><span class="mut">${x.agent}</span><div class="pgrid">${TOOLS.map(t => `<div class="${t[0] === 'agy' ? 'on' : ''}">${markOf(t)}${t[1]}</div>`).join('')}</div><div class="field"><span>${x.agyModel}</span><span class="k">▾</span></div></div>`;
  const s6 = `<div class="tui">${L === 'fr' ? 'Nouvelle session — agent' : 'New session — agent'}
  <span class="dim">  Claude Code</span>
  <span class="dim">  Codex</span>
  <span class="dim">  Cursor Agent</span>
  <span class="sel">▸ Antigravity CLI</span>
  <span class="dim">  OMP</span>
${L === 'fr' ? '↑↓ choisir · entrée valider · échap annuler' : '↑↓ choose · enter confirm · esc cancel'}</div>`;
  const s7 = `<ul class="notes">${x.notes.map(n => `<li>${n}</li>`).join('')}</ul>`;
  document.getElementById('main').innerHTML = card('s1', '1', x.s1, x.s1w, s1, true) + card('s2', '2', x.s2, x.s2w, s2, true) + card('s3', '3', x.s3, x.s3w, s3, true)
    + card('s4', '4', x.s4, x.s4w, s4) + card('s5', '5', x.s5, x.s5w, s5) + card('s6', '6', x.s6, x.s6w, s6) + card('s7', '7', x.s7, '', s7);
}
for (const g of ['mark', 'theme', 'lang']) document.getElementById(g).addEventListener('click', e => {
  const v = e.target.closest('button')?.dataset.v; if (!v) return;
  if (g === 'mark') MARK = v; else if (g === 'lang') L = v; else document.documentElement.dataset.theme = v;
  render();
});
render();
</script>
</body>
</html>
